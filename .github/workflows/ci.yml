name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Only in the public repo (macOS minutes cost extra on private forks).
    if: github.repository == 'manugowda19/noth'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Model tests
        run: Scripts/run_tests.sh
      - name: Build app
        run: ./build.sh debug
